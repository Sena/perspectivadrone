name: E2E Playwright Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  wait-for-deploy:
    name: Wait for Cloudflare Preview
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.cf.outputs.url }}
    steps:
      - name: Wait for Cloudflare Preview URL
        id: cf
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Aguardando o Cloudflare Workers finalizar o deploy..."
          URL=""
          for i in {1..30}; do
            # Chama a API do GitHub para checar o status do commit atual do PR
            CHECKS=$(gh api repos/${{ github.repository }}/commits/$COMMIT_SHA/check-runs)
            
            # Filtra pelo check do Cloudflare
            STATUS=$(echo "$CHECKS" | jq -r '[.check_runs[] | select(.name | contains("Workers Builds"))][0].status')
            CONCLUSION=$(echo "$CHECKS" | jq -r '[.check_runs[] | select(.name | contains("Workers Builds"))][0].conclusion')
            
            if [ "$STATUS" == "completed" ]; then
              if [ "$CONCLUSION" == "success" ]; then
                SUMMARY=$(echo "$CHECKS" | jq -r '[.check_runs[] | select(.name | contains("Workers Builds"))][0].output.summary')
                URL=$(echo "$SUMMARY" | grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' | tail -1)
                echo "✅ Cloudflare finalizado! URL encontrada: $URL"
                break
              else
                echo "❌ Deploy no Cloudflare falhou! Abortando testes."
                exit 1
              fi
            fi
            
            echo "⏳ Ainda processando... ($i/30) aguardando 15s"
            sleep 15
          done
          
          if [ -z "$URL" ]; then
            echo "❌ Timeout esgotado esperando o Cloudflare."
            exit 1
          fi
          
          echo "url=$URL" >> $GITHUB_OUTPUT

  playwright-tests:
    name: Playwright E2E (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    needs: wait-for-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
        
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        
    - name: Cache Playwright Browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

        
    - name: Install dependencies
      run: npx pnpm@10 install --ignore-scripts
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run Playwright tests
      run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      env:
        PLAYWRIGHT_TEST_BASE_URL: ${{ needs.wait-for-deploy.outputs.url }}
        
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-${{ matrix.shardIndex }}
        path: playwright-report/
        retention-days: 15
