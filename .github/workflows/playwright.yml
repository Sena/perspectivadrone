name: E2E Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  wait-for-deploy:
    name: Wait for Cloudflare Preview
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.cf.outputs.url }}
    steps:
      - name: Wait for Cloudflare Preview URL
        id: cf
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "Aguardando o Cloudflare Workers finalizar o deploy..."
          URL=""
          for i in {1..30}; do
            # Chama a API do GitHub para checar o status do commit atual
            CHECKS=$(gh api repos/${{ github.repository }}/commits/$COMMIT_SHA/check-runs)
            
            # Filtra pelo check do Cloudflare
            STATUS=$(echo "$CHECKS" | jq -r '[.check_runs[] | select(.name | contains("Workers Builds"))][0].status')
            CONCLUSION=$(echo "$CHECKS" | jq -r '[.check_runs[] | select(.name | contains("Workers Builds"))][0].conclusion')
            
            if [ "$STATUS" == "completed" ]; then
              if [ "$CONCLUSION" == "success" ]; then
                if [ "${{ github.ref }}" == "refs/heads/main" ]; then
                  URL="https://perspectivadrone2.flaviosena.workers.dev"
                  echo "✅ Cloudflare (Produção via Worker URL) finalizado! URL: $URL"
                else
                  SUMMARY=$(echo "$CHECKS" | jq -r '[.check_runs[] | select(.name | contains("Workers Builds"))][0].output.summary')
                  URL=$(echo "$SUMMARY" | grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' | tail -1)
                  echo "✅ Cloudflare (Preview) finalizado! URL encontrada: $URL"
                fi
                break
              else
                echo "❌ Deploy no Cloudflare falhou! Abortando testes."
                exit 1
              fi
            fi
            
            echo "⏳ Ainda processando... ($i/30) aguardando 15s"
            sleep 15
          done
          
          if [ -z "$URL" ]; then
            echo "❌ Timeout esgotado esperando o Cloudflare."
            exit 1
          fi
          
          echo "🔥 Fazendo warmup do Cloudflare Worker na URL: $URL"
          curl -s -o /dev/null -w "Status Code HTTP da Preview: %{http_code}\n" "$URL"
          
          echo "url=$URL" >> $GITHUB_OUTPUT

  playwright-tests:
    name: Playwright E2E (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    needs: wait-for-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
        
    steps:
    - uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'pnpm'
        
    - name: Cache Playwright Browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install dependencies
      run: pnpm install --ignore-scripts
      
    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps
      
    - name: JIT Warmup Cloudflare Worker
      run: |
        curl -s -o /dev/null -w "JIT Status Code: %{http_code}\n" ${{ needs.wait-for-deploy.outputs.url }}
      
    - name: Run Playwright tests
      run: pnpm exec playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      env:
        PLAYWRIGHT_TEST_BASE_URL: ${{ needs.wait-for-deploy.outputs.url }}
        
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-${{ matrix.shardIndex }}
        path: playwright-report/
        retention-days: 15
