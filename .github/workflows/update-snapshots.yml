name: Update Playwright Snapshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-snapshots:
    name: Update Snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        
    - name: Cache Playwright Browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-playwright-
        
    - name: Install dependencies
      run: npx pnpm@10 install --ignore-scripts
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Start dev server
      run: npx pnpm run dev &
      
    - name: Wait for dev server
      run: |
        while ! curl -s http://localhost:4321 > /dev/null; do
          echo "Waiting for dev server..."
          sleep 5
        done
        echo "Dev server is up!"

    - name: Update Snapshots
      run: npx playwright test tests/visual.spec.ts --update-snapshots --workers=3
      env:
        PLAYWRIGHT_TEST_BASE_URL: http://localhost:4321
        
    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add tests/*-snapshots/
        git commit -m "test: update visual snapshots via GitHub Actions" || echo "No changes to commit"
        git push
